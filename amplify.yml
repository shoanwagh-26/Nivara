version: 1

frontend:
  buildPath: /

  phases:
    preBuild:
      commands:
        - npm ci --prefix frontend
        - npm ci --prefix backend

    build:
      commands:
        - npm run build --prefix frontend

    postBuild:
      commands:
        - bash ./bin/postbuild.sh

  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'